<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林果良品｜林果學苑．商品知識訓練</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
:root{
  --green:#284234;--dark:#002721;--sand:#E2CEB9;--sand-light:#F5EDE3;
  --rust:#A54A1A;--gray-pink:#CFA294;--brown:#8D5531;
  --bg:#F5EDE3;--surface:#fff;--surface2:#FAF5EF;
  --border:rgba(40,66,52,.10);--border2:rgba(40,66,52,.22);
  --text:#284234;--text-muted:#b09a88;
  --pos:#388E3C;--neg:#D32F2F;--warn:#F57C00
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;line-height:1.7}

/* ── Header ── */
.hdr{position:sticky;top:0;z-index:100;background:var(--green);height:54px;
  display:flex;align-items:center;justify-content:space-between;padding:0 2rem}
.brand{display:flex;align-items:center;gap:14px}
.brand-name{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.1em;color:var(--sand)}
.brand-sep{width:1px;height:16px;background:rgba(226,206,185,.3)}
.brand-sub{font-size:10px;color:var(--gray-pink);font-family:'Space Mono',monospace}
.hdr-r{display:flex;align-items:center;gap:14px}
.hdr-back{font-size:11px;color:var(--gray-pink);text-decoration:none;font-family:'Space Mono',monospace;
  border:1px solid rgba(226,206,185,.25);padding:5px 12px;border-radius:14px;transition:.2s;cursor:pointer;background:none}
.hdr-back:hover{background:rgba(226,206,185,.1);color:var(--sand)}

/* ── Hero ── */
.hero{background:var(--green);padding:3rem 1.5rem 2.6rem;text-align:center;
  border-bottom:1px solid rgba(226,206,185,.15)}
.hero-eyebrow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:5px;
  color:var(--gray-pink);text-transform:uppercase;margin-bottom:18px}
.hero-rule{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
.hero-line{width:48px;height:1px;background:rgba(226,206,185,.3)}
.hero-icon{font-size:22px}
.hero-title{font-family:'Noto Sans TC',sans-serif;font-size:clamp(22px,3.4vw,32px);
  font-weight:700;color:var(--sand);letter-spacing:.04em;line-height:1.25;margin-bottom:6px}
.hero-sub{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;
  color:rgba(207,162,148,.7);text-transform:uppercase}

/* ── Container ── */
.container{max-width:980px;margin:0 auto;padding:2.4rem 1.5rem 4rem}

/* ── Overview / 稱號卡 ── */
.overview-card{background:linear-gradient(135deg,var(--green),var(--dark));border-radius:18px;
  padding:24px 26px;margin-bottom:20px;color:var(--sand);box-shadow:0 6px 22px rgba(40,66,52,.18)}
.overview-title-row{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.overview-icon{font-size:34px;width:52px;height:52px;border-radius:50%;background:rgba(226,206,185,.12);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.overview-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;
  color:var(--gray-pink);text-transform:uppercase;margin-bottom:3px}
.overview-title{font-size:19px;font-weight:700;color:var(--sand)}
.overview-stats{display:flex;gap:28px;margin-bottom:14px}
.overview-stat-num{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--sand)}
.overview-stat-label{font-size:11px;color:rgba(226,206,185,.65);margin-top:2px}
.overview-bar-track{height:8px;border-radius:5px;background:rgba(226,206,185,.15);overflow:hidden}
.overview-bar-fill{height:100%;background:linear-gradient(90deg,var(--rust),#d97a42);border-radius:5px;
  transition:width .5s ease}
.overview-next{font-size:11.5px;color:rgba(226,206,185,.7);margin-top:12px;line-height:1.6}

/* ── Module grid ── */
.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.module-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;
  padding:22px 20px;cursor:pointer;transition:.18s;box-shadow:0 2px 10px rgba(40,66,52,.05);
  display:flex;flex-direction:column;gap:10px}
.module-card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 8px 22px rgba(40,66,52,.1)}
.module-icon{font-size:30px}
.module-title{font-size:15px;font-weight:700;color:var(--green)}
.module-desc{font-size:12px;color:var(--text-muted);line-height:1.6;flex:1}
.module-badge{align-self:flex-start;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.5px;
  padding:4px 10px;border-radius:12px;background:var(--sand-light);color:var(--brown);border:1px solid var(--border)}
.module-badge.done{background:rgba(56,142,60,.12);color:var(--pos);border-color:rgba(56,142,60,.3)}
@media(max-width:560px){.module-grid{grid-template-columns:1fr}}

/* ── Lesson runner ── */
.lesson-wrap{display:none}
.lesson-wrap.show{display:block}
.progress-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.progress-bar-track{flex:1;height:6px;border-radius:4px;background:var(--sand-light);overflow:hidden}
.progress-bar-fill{height:100%;background:var(--green);border-radius:4px;transition:width .3s ease}
.progress-step-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted);white-space:nowrap}
.lesson-exit{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted);
  background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.step-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;
  padding:32px 32px;box-shadow:0 4px 18px rgba(40,66,52,.06);animation:slide-in .3s ease;
  max-width:700px;margin:0 auto}
@keyframes slide-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step-card.article-mode{max-width:920px;padding:44px 64px}
.article-section > *{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.article-section.revealed > *{opacity:1;transform:translateY(0)}
.article-section > *:nth-child(1){transition-delay:.02s}
.article-section > *:nth-child(2){transition-delay:.1s}
.article-section > *:nth-child(3){transition-delay:.18s}
.article-section > *:nth-child(4){transition-delay:.26s}
.article-section > *:nth-child(5){transition-delay:.34s}
@media(prefers-reduced-motion:reduce){
  .article-section > *{opacity:1;transform:none;transition:none}
}
.step-kicker{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;
  color:var(--gray-pink);text-transform:uppercase;margin-bottom:10px}
.step-photo{width:100%;max-height:280px;object-fit:cover;border-radius:14px;margin-bottom:12px;
  display:block;box-shadow:0 4px 14px rgba(40,66,52,.1)}
.article-mode .step-photo{max-height:400px}
.step-photo-cap{font-size:12px;color:var(--text-muted);margin:0 0 18px;font-family:'Noto Sans TC',sans-serif;
  font-style:italic;text-align:center;letter-spacing:.3px}
.article-section{margin-top:36px;padding-top:32px;border-top:1px solid var(--border)}
.article-section:first-of-type{margin-top:0;padding-top:0;border-top:none}
.article-section-eyebrow{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:3px;
  color:var(--rust);text-transform:uppercase;margin-bottom:8px}
.article-section-title{font-size:23px;font-weight:700;color:var(--green);margin-bottom:16px;line-height:1.4;
  letter-spacing:.01em}
.article-divider{display:none}
.step-title{font-size:19px;font-weight:700;color:var(--green);margin-bottom:16px;line-height:1.5}
.step-body{font-size:14.5px;line-height:1.9;color:var(--text);max-width:74ch}
.article-mode .step-body{font-size:15.5px;line-height:2}
.step-body strong{color:var(--rust)}

.table-scroll{overflow-x:auto;margin:12px 0;border-radius:10px;border:1px solid var(--border)}
.ref-table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
.ref-table th,.ref-table td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:center}
.ref-table th{background:var(--sand-light);color:var(--green);font-weight:700;position:sticky;left:0}
.ref-table tr:last-child td{border-bottom:none}

.quiz-options{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.quiz-opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;
  padding:13px 16px;font-size:13.5px;color:var(--text);cursor:pointer;transition:.15s;font-family:inherit;line-height:1.6}
.quiz-opt:hover:not(:disabled){border-color:var(--green);background:#fff}
.quiz-opt:disabled{cursor:default}
.quiz-opt.correct{border-color:var(--pos);background:rgba(56,142,60,.1);color:var(--pos);font-weight:700}
.quiz-opt.wrong{border-color:var(--neg);background:rgba(211,47,47,.08);color:var(--neg);font-weight:700}
.quiz-feedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.8;
  background:var(--sand-light);border:1px dashed var(--border2);display:none}
.quiz-feedback.show{display:block}
.quiz-feedback .fb-head{font-weight:700;margin-bottom:4px}
.quiz-feedback.correct-fb .fb-head{color:var(--pos)}
.quiz-feedback.wrong-fb .fb-head{color:var(--neg)}

.step-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.btn{font-family:'Noto Sans TC',sans-serif;font-size:13.5px;font-weight:700;border:none;border-radius:12px;
  padding:12px 24px;cursor:pointer;transition:.18s}
.btn-primary{background:var(--green);color:var(--sand)}
.btn-primary:hover{background:var(--dark)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:none;color:var(--text-muted);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--green);border-color:var(--green)}

/* ── Result screen ── */
.result-wrap{display:none;text-align:center}
.result-wrap.show{display:block}
.result-emoji{font-size:52px;margin-bottom:14px}
.result-title{font-size:20px;font-weight:700;color:var(--green);margin-bottom:8px}
.result-score{font-family:'Space Mono',monospace;font-size:38px;font-weight:700;color:var(--rust);margin:14px 0}
.result-score small{font-size:16px;color:var(--text-muted)}
.result-sub{font-size:13px;color:var(--text-muted);margin-bottom:26px}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.intro{text-align:center;color:var(--text-muted);padding:0 0 2rem;font-size:13px;line-height:1.9}
.intro strong{color:var(--green)}

.footer{border-top:1px solid var(--border);padding:1.6rem;text-align:center;
  font-family:'Space Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:1.5px}

@media(max-width:900px){
  .step-card.article-mode{max-width:700px;padding:32px 32px}
  .article-mode .step-body{font-size:14.5px;line-height:1.9}
  .article-section-title{font-size:19px}
}
@media(max-width:540px){
  .hdr{padding:0 1rem}
  .hero{padding:2.2rem 1rem 2rem}
  .container{padding:2rem 1rem 3rem}
  .step-card{padding:22px 18px}
  .step-card.article-mode{padding:22px 18px}
  .article-section{margin-top:26px;padding-top:22px}
}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="brand">
    <div class="brand-name">ORINGO</div>
    <div class="brand-sep"></div>

<div class="container">

<script>
// ============================================================
// 林果學苑 — 進度記錄 API
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbybDRIBOBbjPMH43C5GKB83JsaND2hK0sMYHGkKxXvcLckQ-rVikaPYtHvsxdst7Z7g/exec';

function getEmail() {
  try {
    const s = JSON.parse(localStorage.getItem('oringo_auth_v1') || 'null');
    return (s && s.email) || '';
  } catch { return ''; }
}

// ============================================================
// 課程內容：第2冊 商品知識手冊
// ============================================================
const MODULES = [
{
  id:'brand', icon:'👞', title:'林果特色與鞋子構造', desc:'三大特色、各部位名稱、製鞋工藝、售後服務',
  steps:[
    {type:'card', title:'林果三大特色', body:`林果鞋的三大特色：<br>
1️⃣ 以<strong>台灣人的版型</strong>開發楦頭<br>
2️⃣ 由<strong>台灣師傅</strong>手工製作<br>
3️⃣ <strong>皮革大底</strong>鞋款<br><br>
銷售時，我們得先知道鞋子各部位的名稱與主要功用，在顧客提出疑問時，便能展現我們的專業知識，讓顧客對我們更加信任。`},
    {type:'quiz', q:'林果鞋的三大特色不包含以下哪一項？',
      options:['以台灣人的版型開發楦頭','由台灣師傅手工製作','全部改用進口機器大量量產','皮革大底鞋款'],
      correct:2, exp:'林果強調台灣楦頭＋台灣師傅手工＋皮革大底，並非強調機器量產。'},

    {type:'card', title:'認識港寶', photo:'assets/training/brand-anatomy.jpg', photoCap:'鞋子各部位名稱一次看懂',
      body:`<strong>港寶</strong>：是由複合性材質製作，原本軟軟的像紙張一樣，泡過甲苯進烤箱烘烤後，就會變硬定型。<br><br>
因此只要港寶遭受外力壓到或踢到是不能修復的。如：穿鞋沒有使用鞋拔，不小心踩到後牆；踢摩托車停車桿，鞋頭凹一個洞；顧客想要測試鞋子軟不軟，直接用手按壓之類的……狀況。<br><br>
所以，夥伴們在服務的過程，我們也能讓顧客知道保護港寶是維持鞋子外觀最基本的第一步唷！`},
    {type:'quiz', q:'情境題：客人說「我鞋頭被摩托車停車架踢到凹了一個洞，可以修好嗎？」你會怎麼回答比較正確？',
      options:[
        '「沒問題，我們可以幫您敲回原狀」',
        '「這個位置是港寶，屬於受力後不可逆的結構材質，一旦凹陷無法修復；之後建議搭配鞋拔、留意尖銳物碰撞就能避免」',
        '「這是皮革本身的問題，應該是你保養不夠好」',
        '「這雙鞋壽命到了，建議直接買新的」'],
      correct:1, exp:'港寶泡甲苯烘烤定型後會變硬，受外力壓迫是材質特性造成的不可逆損傷，不是保養問題。要誠實說明原因，並提供預防建議（用鞋拔、避免尖銳物碰撞），不要隨口答應能修復，也不要把責任推給客人。'},

    {type:'card', title:'金油與中底鐵芯', body:`<strong>金油</strong>：鞋頭、鞋跟會上的後處理，是一層薄薄的鞋子的保護漆，會有亮度。<br><br>
<strong>中底(含鐵芯)</strong>：是由複合性材質製作(類似硬紙板)，與楦頭底貼合後，讓鞋面皮革固定於上，幫助固定鞋型，於鞋腰(足弓)處延伸至腳跟中心有固定一長條狀鐵片，稱為鐵芯，功用為讓有跟鞋款起伏處有支撐效果，加強支撐力，延長鞋子壽命。`},
    {type:'quiz', q:'為什麼林果的鞋子鞋頭、後跟摸起來會亮，但中段不會？',
      options:['中段刻意不上金油，因為走路彎折容易讓金油龜裂，只上薄薄一層蠟','中段沒有做完整工序，是品管疏漏','中段材質跟鞋頭不同，本來就不能上金油','這是消費者自己保養不當造成的'],
      correct:0, exp:'鞋頭、後跟走路時不太會彎折，適合上金油做保護與亮度；中段會隨走路彎折，上金油容易裂開，所以只上薄薄一層蠟。'},
    {type:'quiz', q:'中底裡的「鐵芯」主要功能是什麼？',
      options:['讓鞋子變重顯得比較高級','加強足弓/鞋腰起伏處的支撐力，延長鞋子壽命','防止鞋子進水','用來辨別是不是真皮'],
      correct:1, exp:'鐵芯是一長條鐵片，從鞋腰(足弓)延伸到腳跟中心，加強有跟鞋款起伏處的支撐效果。'},

    {type:'card', title:'大底與天皮', body:`<strong>大底</strong>：有各種材質，例如真皮、橡膠、發泡材質等……，為鞋子最主要結構。<br><br>
<strong>天皮</strong>：後腳跟區域的橡膠片，主要用途為止滑，通常可拆卸下來做更換，維持大底的壽命。<br><br>
🎁 林果有提供紳士鞋類天皮<strong>免費更換一次</strong>的服務。`},

    {type:'card', title:'售後服務總整理', body:`<strong>14天鑑賞期，尺碼更換免費</strong><br>

<strong>保固期維修</strong><br>

    {type:'card', title:'常見Q&A：黏合鞋與生膠底', body:`<strong>Q：用黏合的鞋子是不是比較不容易壞掉？</strong><br>
A：台灣師傅在學習製作皮鞋的時候，每一個步驟都是重要的：包括皮革經過打磨的過程、上膠以及鞋面與大底接合的時間點都是非常重要的，而鞋子都是有經過拉力測試<strong>超過國家標準2倍以上</strong>，因此不需要擔心因為黏合這個名詞而有開口的疑慮。但如有以下之狀況則會在評量之外：①經常性在雨天穿著、在鞋子裡頭的水份而全跑掉前持續穿著會使得皮革的韌度慢慢失去彈性，也同時會使膠水漸失去黏性。②消耗品需定期更換。例如天皮，天皮在磨損到接近木跟的位置就需要馬上進行更換。<br><br>
<strong>Q：什麼是生膠底？林果良品的皮鞋是使用生膠底嗎？</strong><br>
A：生膠底即為未煉過的橡膠，柔軟度較佳，如遇夏天較熱溫度時，踩於地面上會有些許黏黏的，耐磨程度與煉過的橡膠大底差不多，但處於亞熱帶地區的台灣較為不適合。林果良品使用的皮鞋及休閒鞋皆為<strong>煉過的橡膠大底</strong>，柔軟度較硬一些，密度也會較為緊密一些，耐磨程度較好。`},
    {type:'quiz', q:'情境題：客人問「你們黏合的鞋是不是比較容易壞掉？」你的回答應該是？',
      options:['對啊，黏的比較不耐用，建議選車縫的款式','我們的鞋子都經過超過國家標準2倍以上的拉力測試，只要避免長期泡水、定期更換天皮，不會有開口的問題','不清楚，要問廠長才知道','黏合鞋完全不會壞，可以放心亂穿'],
      correct:1, exp:'要用具體的數據（拉力測試超過國家標準2倍以上）建立信任，同時誠實提醒正確的保養方式（避免長期泡水、定期更換天皮），而不是模糊帶過或誇大。'},

    {type:'card', title:'常見Q&A：磨腳與皮革透氣度', body:`<strong>手工鞋不會磨腳嗎？</strong> 磨腳最常見的兩個原因：①鞋子太大或太小，無法完整包覆腳型。②皮革較厚或經過額外塗料處理，雖然不易進水但較不透氣、較硬。台灣氣候與腳型下，林果多數鞋款使用較薄的皮革，透氣舒適度較佳。<br><br>
<strong>皮鞋穿久會不會臭？</strong> 基本上不會，因為鞋面是真牛皮，皮革有毛孔可以排出汗水濕氣；皮底鞋透氣度最好。若使用頻繁（如工作鞋），建議準備兩雙交替穿。`},
    {type:'quiz', q:'情境題：客人擔心「常穿皮鞋工作，會不會很臭？」比較好的回答方向是？',
      options:['會啊，皮鞋本來就比較悶熱','基本上不會，真牛皮的皮革有毛孔可以排出汗水濕氣，若使用頻繁建議準備兩雙交替穿更能改善','不會，因為我們的鞋子有除臭噴霧','這個問題不重要，可以不用回答'],
      correct:1, exp:'用材質特性（真皮毛孔透氣）建立信心，同時給出實用建議（頻繁使用時兩雙交替穿），是比較完整、專業的回答方式。'}
  ]

      body:`<strong>結構介紹</strong>：命名是源自於1856年 Lyman Reed Blake 設計的車底機, 其後由Gordon McKay購買專利大量生產此機台, 因此也有人稱 McKay 結構。<br><br>

    {type:'card', title:'固特異結構 Goodyear construction', body:`<strong>結構介紹</strong>：古老的結構法, 後分為手縫與機縫作法, 此結構的命名是來自於1870年代發明合縫肋條縫紉機的Charles Goodyear, Jr.。<br><br>

    {type:'card', title:'常見問題FAQ', body:`<strong>發霉</strong><br>
如已遇到發霉，可用消毒酒精加水以1:3比例拭去霉菌，放置一個下午或一個晚上使其乾燥，最後再擦上鞋油即可。（建議以深色鞋款為主，淺色鞋款請請教專業師傅）<br><br>
<strong>皮底發霉</strong><br>
如遇皮底發霉，可使用豬鬃刷先刷去表層霉菌，然後找塊不要的布料沾取微量去漬油或酒精殺去菌絲，如有無法完全擦去的霉菌，可趁天氣好的時候，直接到柏油路上將其磨損掉。<br><br>
<strong>碰到水</strong><br>
一般製作鞋子的皮革都有一層基本的防水處理，如不是傾盆大雨的情況，回到家之後使用綿布輕壓吸附表面水漬，最後再放置於通風處一個晚上即可。如水份已經滲透到鞋內裏的話，可塞入沒有油墨的紙團，以三十分鐘為一循環更換約三~四次，也可開啟電風扇距離約三~五公尺使其轉動，加速空氣流動也可使皮革乾燥速度加快。<br><br>
<strong>Q：鞋子碰到機車油漬黑黑的怎麼辦？鞋面被油漆滴到要如何處理？</strong><br>
A：門市基本上直接送鞋面維修或不處理，小範圍可稍微用細砂紙或生膠擦在範圍內試試看可否清除後再上蠟補色，大範圍會直接告知沒有辦法處理。<br><br>
<strong>Q：若已鞋面維修，還可以再二次送師傅鞋面維修嗎？</strong><br>
A：不建議喲！因為師傅這邊的維修會經過打磨的程序，因鞋子已使用了更長的時間若再次維修可能會讓皮面變得更脆弱，所以建議可穿到自然汰換掉。`},

// ============================================================
// State & rendering
// ============================================================
let progressCache = {};
let currentModule = null;
let currentPhase = 'read'; // 'read' (讀完整段知識) 先於 'quiz' (再一次考完整份測驗)
let readSteps = [];
let quizSteps = [];
let readIdx = 0;
let quizIdx = 0;
let answers = {}; // quizIdx -> {picked, correct}

const $ = (id) => document.getElementById(id);

async function loadProgress() {
  renderModuleGrid(); // 先用「尚未開始」畫面立刻顯示，不要卡在等 GAS 回應（GAS 常常要2-3秒以上）
  const email = getEmail();
  if (!email || !GAS_URL) return;
  try {
    const res = await fetch(GAS_URL + '?action=getProgress&email=' + encodeURIComponent(email));
    const data = await res.json();
    if (data && data.success) { progressCache = data.progress || {}; renderModuleGrid(); } // 拿到真實進度後再補畫一次徽章
  } catch (e) { console.warn('讀取學習進度失敗', e); }
}

function renderModuleGrid() {
  const grid = $('module-grid');
  grid.innerHTML = '';
  MODULES.forEach(m => {
    const p = progressCache[m.id];
    const card = document.createElement('div');
    card.className = 'module-card';
    card.innerHTML = `
      <div class="module-icon">${m.icon}</div>
      <div class="module-title">${m.title}</div>
      <div class="module-desc">${m.desc}</div>
      <div class="module-badge ${p ? 'done' : ''}">${p ? ('✅ 已完成 · ' + p.percent + '%') : '尚未開始'}</div>
    `;
    card.addEventListener('click', () => startModule(m.id));
    grid.appendChild(card);
  });
  renderOverview();
}

// 稱號是跟自己比，不是跟別人比：完成的模組越多，稱號跟著晉升。
const TITLES = [
  { min: 0, label: '新手夥伴', icon: '🌱' },
  { min: 1, label: '見習店員', icon: '📚' },
  { min: 2, label: '熟手店員', icon: '🧵' },
  { min: 3, label: '資深顧問', icon: '🎯' },
  { min: 4, label: '林果達人', icon: '🏅' }
];

function renderOverview() {
  const doneIds = Object.keys(progressCache);
  const doneCount = doneIds.length;
  const totalModules = MODULES.length;
  const totalScore = doneIds.reduce((sum, id) => sum + (Number(progressCache[id].score) || 0), 0);
  const totalQuestions = doneIds.reduce((sum, id) => sum + (Number(progressCache[id].total) || 0), 0);
  const overallPercent = totalQuestions ? Math.round((totalScore / totalQuestions) * 100) : null;

  let tier = TITLES[0];
  for (const t of TITLES) if (doneCount >= t.min) tier = t;
  let title = tier.label, icon = tier.icon;
  if (doneCount === totalModules && overallPercent !== null && overallPercent >= 90) {
    title = '林果大師'; icon = '👑';
  }

  $('overview-icon').textContent = icon;
  $('overview-title').textContent = title;
  $('overview-modules').textContent = doneCount + '/' + totalModules;
  $('overview-accuracy').textContent = overallPercent === null ? '–' : overallPercent + '%';
  $('overview-bar-fill').style.width = Math.round((doneCount / totalModules) * 100) + '%';

  const nextEl = $('overview-next');
  if (doneCount >= totalModules) {
    nextEl.textContent = overallPercent !== null && overallPercent >= 90
      ? '全部模組通關，而且正確率超過90%——你已經是林果大師了！'
      : '全部模組都完成了！把正確率拚到 90% 以上，就能晉升「林果大師」。';
  } else {
    const nextTier = TITLES.find(t => t.min === doneCount + 1);
    nextEl.textContent = nextTier
      ? `再完成 1 個模組，就能從「${title}」晉升「${nextTier.label}」`
      : '';
  }
}

function startModule(id) {
  currentModule = MODULES.find(m => m.id === id);
  readSteps = currentModule.steps.filter(s => s.type === 'card');
  quizSteps = currentModule.steps.filter(s => s.type === 'quiz');
  currentPhase = 'read';
  readIdx = 0;
  quizIdx = 0;
  answers = {};
  $('module-grid').style.display = 'none';
  $('intro-text').style.display = 'none';
  $('result-wrap').classList.remove('show');
  $('lesson-wrap').classList.add('show');
  renderStep();
}

function backToList() {
  $('lesson-wrap').classList.remove('show');
  $('result-wrap').classList.remove('show');
  $('module-grid').style.display = 'grid';
  $('intro-text').style.display = 'block';
  renderModuleGrid();
}

// 先讓夥伴讀完一個模組「完整的知識內容」，讀完才進入測驗階段一次考完，
// 避免邊讀邊考只是靠短期記憶作答、讀完就忘、知識也學得零碎。
function renderStep() {
  if (currentPhase === 'read') renderReadStep();
  else renderQuizStep();
}

// 讀的階段不再一張卡片一張卡片翻頁——整個模組的知識內容一次全部顯示成一篇完整
// 文章，讓夥伴用「看文章」的方式從頭讀到尾，讀完才進入測驗，而不是每讀一小段
// 就要點一次「下一步」翻頁。
function renderReadStep() {
  $('progress-label').textContent = '閱讀完整內容';
  $('progress-fill').style.width = '8%';

  const sectionsHtml = readSteps.map((step, i) => {
    const photoHtml = step.photo
      ? `<img class="step-photo" src="${step.photo}" alt="${step.title}" loading="lazy">${step.photoCap ? '<div class="step-photo-cap">📷 '+step.photoCap+'</div>' : ''}`
      : '';
    const idx = String(i + 1).padStart(2, '0');
    return `
      <div class="article-section">
        <div class="article-section-eyebrow">${idx} / ${String(readSteps.length).padStart(2,'0')}</div>
        <div class="article-section-title">${step.title}</div>
        ${photoHtml}
        <div class="step-body">${step.body}</div>
      </div>`;
  }).join('');

  const card = $('step-card');
  card.classList.add('article-mode');
  card.innerHTML = `
    <div class="step-kicker">${currentModule.title} · 閱讀完整內容（共 ${readSteps.length} 段，讀完才開始測驗）</div>
    <div class="step-title">${currentModule.title}</div>
    ${sectionsHtml}
    <div class="step-nav" style="justify-content:center;margin-top:8px">
      <button class="btn btn-primary" id="btn-next" style="width:100%;max-width:360px">${quizSteps.length ? '讀完了，開始測驗 →' : '完成模組'}</button>
    </div>`;
  $('btn-next').addEventListener('click', () => {
    if (quizSteps.length) { currentPhase = 'quiz'; quizIdx = 0; renderStep(); }
    else finishModule();
  });
  window.scrollTo({ top: 0, behavior: 'instant' });
  revealSectionsOnScroll();
}

// 段落隨捲動輕輕浮現，讓閱讀長文的過程更有節奏感、不無聊。
// 用 scroll + getBoundingClientRect 而不是 IntersectionObserver，避免在部分瀏覽器/
// 內嵌環境下 observer callback 不觸發的問題。
function revealSectionsOnScroll() {
  const sections = Array.from(document.querySelectorAll('.article-section'));
  function checkReveal() {
    const vh = window.innerHeight || document.documentElement.clientHeight;
    let remaining = false;
    sections.forEach(s => {
      if (s.classList.contains('revealed')) return;
      const r = s.getBoundingClientRect();
      if (r.top < vh * 0.92 && r.bottom > 0) s.classList.add('revealed');
      else remaining = true;
    });
    if (!remaining) {
      window.removeEventListener('scroll', checkReveal);
      window.removeEventListener('resize', checkReveal);
    }
  }
  window.addEventListener('scroll', checkReveal, { passive: true });
  window.addEventListener('resize', checkReveal);
  checkReveal();
}

function renderQuizStep() {
  const step = quizSteps[quizIdx];
  const isLast = quizIdx === quizSteps.length - 1;
  $('progress-label').textContent = '測驗 ' + (quizIdx + 1) + ' / ' + quizSteps.length;
  $('progress-fill').style.width = (10 + Math.round((quizIdx / quizSteps.length) * 90)) + '%';

  const prevAnswer = answers[quizIdx];
  const card = $('step-card');
  card.classList.remove('article-mode');
  card.innerHTML = `
    <div class="step-kicker">🧠 小測驗（讀完了，靠記憶作答）</div>
    <div class="step-title">${step.q}</div>
    <div class="quiz-options" id="quiz-options"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <div class="step-nav">
      <button class="btn btn-ghost" id="btn-prev">上一步</button>
      <button class="btn btn-primary" id="btn-next" disabled>${isLast ? '完成模組' : '下一步'}</button>
    </div>`;
  const optWrap = $('quiz-options');
  step.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'quiz-opt';
    b.textContent = opt;
    b.addEventListener('click', () => selectAnswer(i));
    optWrap.appendChild(b);
  });
  $('btn-next').addEventListener('click', () => {
    if (isLast) finishModule();
    else { quizIdx++; renderStep(); }
  });
  $('btn-prev').addEventListener('click', () => {
    if (quizIdx > 0) { quizIdx--; renderStep(); }
    else { currentPhase = 'read'; renderStep(); }
  });
  if (prevAnswer) showQuizFeedback(prevAnswer.picked, true);
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function selectAnswer(pickedIdx) {
  const step = quizSteps[quizIdx];
  if (answers[quizIdx]) return; // already answered
  const isCorrect = pickedIdx === step.correct;
  answers[quizIdx] = { picked: pickedIdx, correct: isCorrect };
  showQuizFeedback(pickedIdx, false);
}

function showQuizFeedback(pickedIdx) {
  const step = quizSteps[quizIdx];
  const opts = document.querySelectorAll('#quiz-options .quiz-opt');
  opts.forEach((b, i) => {
    b.disabled = true;
    if (i === step.correct) b.classList.add('correct');
    else if (i === pickedIdx) b.classList.add('wrong');
  });
  const isCorrect = pickedIdx === step.correct;
  const fb = $('quiz-feedback');
  fb.className = 'quiz-feedback show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = `<div class="fb-head">${isCorrect ? '✅ 答對了！' : '❌ 答錯了'}</div><div>${step.exp}</div>`;
  $('btn-next').disabled = false;
}

function finishModule() {
  const total = quizSteps.length;
  const score = quizSteps.filter((s, i) => answers[i] && answers[i].correct).length;
  const percent = total ? Math.round((score/total)*100) : 100;
  const prevRecord = progressCache[currentModule.id]; // 記下這次覆蓋前的成績，跟自己比

  $('lesson-wrap').classList.remove('show');
  $('result-wrap').classList.add('show');
  $('result-emoji').textContent = percent >= 80 ? '🎉' : (percent >= 50 ? '💪' : '📖');
  $('result-title').textContent = currentModule.title + ' · 完成！';
  $('result-score').innerHTML = score + ' / ' + total + '<small> 題答對</small>';

  let subText = percent >= 80
    ? '表現很棒，這個模組你已經掌握得不錯了！'
    : (percent >= 50 ? '基本掌握了，建議重新測驗一次加深印象。' : '建議重新讀過一次，把答錯的觀念再確認清楚。');
  if (prevRecord && typeof prevRecord.percent === 'number') {
    const diff = percent - prevRecord.percent;
    if (diff > 0) subText = `↑ 比上次進步了 ${diff} 分（上次 ${prevRecord.percent}% → 這次 ${percent}%），跟自己比一直在變好！`;
    else if (diff < 0) subText = `這次 ${percent}%，比上次(${prevRecord.percent}%)低一點，再挑戰一次找回手感吧。`;
    else subText = `跟上次一樣是 ${percent}%，穩定發揮！想再進步一階，可以重新測驗看看。`;
  }
  $('result-sub').textContent = subText;

  const email = getEmail();
  if (email && GAS_URL) {
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'recordProgress', email,
        moduleId: currentModule.id, moduleTitle: currentModule.title,
        score, total
      })
    }).then(() => {
      progressCache[currentModule.id] = { moduleTitle: currentModule.title, score, total, percent };
      renderOverview();
    }).catch(e => console.warn('進度記錄失敗', e));
  }
}

$('lesson-exit').addEventListener('click', backToList);
$('btn-back-list').addEventListener('click', backToList);
$('btn-retry').addEventListener('click', () => startModule(currentModule.id));

loadProgress();
</script>
