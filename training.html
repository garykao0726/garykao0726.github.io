<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林果良品｜林果學苑．商品知識訓練</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --green:#284234;--dark:#002721;--sand:#E2CEB9;--sand-light:#F5EDE3;
  --rust:#A54A1A;--gray-pink:#CFA294;--brown:#8D5531;
  --bg:#F5EDE3;--surface:#fff;--surface2:#FAF5EF;
  --border:rgba(40,66,52,.10);--border2:rgba(40,66,52,.22);
  --text:#284234;--text-muted:#b09a88;
  --pos:#388E3C;--neg:#D32F2F;--warn:#F57C00
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;line-height:1.7}

/* ── Header ── */
.hdr{position:sticky;top:0;z-index:100;background:var(--green);height:54px;
  display:flex;align-items:center;justify-content:space-between;padding:0 2rem}
.brand{display:flex;align-items:center;gap:14px}
.brand-name{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.1em;color:var(--sand)}
.brand-sep{width:1px;height:16px;background:rgba(226,206,185,.3)}
.brand-sub{font-size:10px;color:var(--gray-pink);font-family:'Space Mono',monospace}
.hdr-r{display:flex;align-items:center;gap:14px}
.hdr-back{font-size:11px;color:var(--gray-pink);text-decoration:none;font-family:'Space Mono',monospace;
  border:1px solid rgba(226,206,185,.25);padding:5px 12px;border-radius:14px;transition:.2s;cursor:pointer;background:none}
.hdr-back:hover{background:rgba(226,206,185,.1);color:var(--sand)}

/* ── Hero ── */
.hero{background:var(--green);padding:3rem 1.5rem 2.6rem;text-align:center;
  border-bottom:1px solid rgba(226,206,185,.15)}
.hero-eyebrow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:5px;
  color:var(--gray-pink);text-transform:uppercase;margin-bottom:18px}
.hero-rule{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
.hero-line{width:48px;height:1px;background:rgba(226,206,185,.3)}
.hero-icon{font-size:22px}
.hero-title{font-family:'Noto Sans TC',sans-serif;font-size:clamp(22px,3.4vw,32px);
  font-weight:700;color:var(--sand);letter-spacing:.04em;line-height:1.25;margin-bottom:6px}
.hero-sub{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;
  color:rgba(207,162,148,.7);text-transform:uppercase}

/* ── Container ── */
.container{max-width:780px;margin:0 auto;padding:2.4rem 1.5rem 4rem}

/* ── Module grid ── */
.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.module-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;
  padding:22px 20px;cursor:pointer;transition:.18s;box-shadow:0 2px 10px rgba(40,66,52,.05);
  display:flex;flex-direction:column;gap:10px}
.module-card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 8px 22px rgba(40,66,52,.1)}
.module-icon{font-size:30px}
.module-title{font-size:15px;font-weight:700;color:var(--green)}
.module-desc{font-size:12px;color:var(--text-muted);line-height:1.6;flex:1}
.module-badge{align-self:flex-start;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.5px;
  padding:4px 10px;border-radius:12px;background:var(--sand-light);color:var(--brown);border:1px solid var(--border)}
.module-badge.done{background:rgba(56,142,60,.12);color:var(--pos);border-color:rgba(56,142,60,.3)}
@media(max-width:560px){.module-grid{grid-template-columns:1fr}}

/* ── Lesson runner ── */
.lesson-wrap{display:none}
.lesson-wrap.show{display:block}
.progress-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.progress-bar-track{flex:1;height:6px;border-radius:4px;background:var(--sand-light);overflow:hidden}
.progress-bar-fill{height:100%;background:var(--green);border-radius:4px;transition:width .3s ease}
.progress-step-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted);white-space:nowrap}
.lesson-exit{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted);
  background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.step-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;
  padding:30px 28px;box-shadow:0 4px 18px rgba(40,66,52,.06);animation:slide-in .3s ease}
@keyframes slide-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step-kicker{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;
  color:var(--gray-pink);text-transform:uppercase;margin-bottom:10px}
.step-title{font-size:19px;font-weight:700;color:var(--green);margin-bottom:16px;line-height:1.5}
.step-body{font-size:14.5px;line-height:1.9;color:var(--text)}
.step-body strong{color:var(--rust)}

.table-scroll{overflow-x:auto;margin:12px 0;border-radius:10px;border:1px solid var(--border)}
.ref-table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
.ref-table th,.ref-table td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:center}
.ref-table th{background:var(--sand-light);color:var(--green);font-weight:700;position:sticky;left:0}
.ref-table tr:last-child td{border-bottom:none}

.quiz-options{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.quiz-opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;
  padding:13px 16px;font-size:13.5px;color:var(--text);cursor:pointer;transition:.15s;font-family:inherit;line-height:1.6}
.quiz-opt:hover:not(:disabled){border-color:var(--green);background:#fff}
.quiz-opt:disabled{cursor:default}
.quiz-opt.correct{border-color:var(--pos);background:rgba(56,142,60,.1);color:var(--pos);font-weight:700}
.quiz-opt.wrong{border-color:var(--neg);background:rgba(211,47,47,.08);color:var(--neg);font-weight:700}
.quiz-feedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.8;
  background:var(--sand-light);border:1px dashed var(--border2);display:none}
.quiz-feedback.show{display:block}
.quiz-feedback .fb-head{font-weight:700;margin-bottom:4px}
.quiz-feedback.correct-fb .fb-head{color:var(--pos)}
.quiz-feedback.wrong-fb .fb-head{color:var(--neg)}

.step-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.btn{font-family:'Noto Sans TC',sans-serif;font-size:13.5px;font-weight:700;border:none;border-radius:12px;
  padding:12px 24px;cursor:pointer;transition:.18s}
.btn-primary{background:var(--green);color:var(--sand)}
.btn-primary:hover{background:var(--dark)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:none;color:var(--text-muted);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--green);border-color:var(--green)}

/* ── Result screen ── */
.result-wrap{display:none;text-align:center}
.result-wrap.show{display:block}
.result-emoji{font-size:52px;margin-bottom:14px}
.result-title{font-size:20px;font-weight:700;color:var(--green);margin-bottom:8px}
.result-score{font-family:'Space Mono',monospace;font-size:38px;font-weight:700;color:var(--rust);margin:14px 0}
.result-score small{font-size:16px;color:var(--text-muted)}
.result-sub{font-size:13px;color:var(--text-muted);margin-bottom:26px}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.intro{text-align:center;color:var(--text-muted);padding:0 0 2rem;font-size:13px;line-height:1.9}
.intro strong{color:var(--green)}

.footer{border-top:1px solid var(--border);padding:1.6rem;text-align:center;
  font-family:'Space Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:1.5px}

@media(max-width:540px){
  .hdr{padding:0 1rem}
  .hero{padding:2.2rem 1rem 2rem}
  .container{padding:2rem 1rem 3rem}
  .step-card{padding:22px 18px}
}
</style>
</head>

// ============================================================

const MODULES = [

    {type:'card', title:'認識港寶', body:`<strong>港寶</strong>是複合性材質製作的鞋頭/鞋跟內襯，原本軟軟的像紙張，泡過甲苯進烤箱烘烤後才會變硬定型。<br><br>

    {type:'card', title:'金油與中底鐵芯', body:`<strong>金油</strong>：鞋頭、鞋跟會上的一層薄薄後處理保護漆，帶有亮度。中段因為走路會彎折，只上薄薄一層蠟，不上金油（否則金油會裂開）。<br><br>

      correct:0, exp:'鞋頭、後跟走路時不太會彎折，適合上金油做保護與亮度；中段會隨走路彎折，上金油容易裂開，所以只上薄薄一層蠟。'},

    {type:'card', title:'鞋底材質比較', body:`<div class="table-scroll"><table class="ref-table">

    {type:'card', title:'常見Q&A：黏合鞋與生膠底', body:`<strong>黏合的鞋子容易壞掉嗎？</strong><br>
林果的鞋子都經過拉力測試，超過<strong>國家標準2倍以上</strong>，只要避免長期泡水、記得定期更換天皮，不用擔心開口問題。<br><br>
<strong>生膠底 vs 煉膠底</strong>：生膠底是未煉過的橡膠，柔軟度較佳，但夏天較黏、不適合亞熱帶氣候。林果的皮鞋及休閒鞋都是<strong>煉過的橡膠大底</strong>，密度較緊密、耐磨程度較好。`},
    {type:'quiz', q:'情境題：客人問「你們黏合的鞋是不是比較容易壞掉？」你的回答應該是？',
      options:['對啊，黏的比較不耐用，建議選車縫的款式','我們的鞋子都經過超過國家標準2倍以上的拉力測試，只要避免長期泡水、定期更換天皮，不會有開口的問題','不清楚，要問廠長才知道','黏合鞋完全不會壞，可以放心亂穿'],
      correct:1, exp:'要用具體的數據（拉力測試超過國家標準2倍以上）建立信任，同時誠實提醒正確的保養方式（避免長期泡水、定期更換天皮），而不是模糊帶過或誇大。'},

    {type:'card', title:'常見Q&A：磨腳與皮革透氣度', body:`<strong>手工鞋不會磨腳嗎？</strong> 磨腳最常見的兩個原因：①鞋子太大或太小，無法完整包覆腳型。②皮革較厚或經過額外塗料處理，雖然不易進水但較不透氣、較硬。台灣氣候與腳型下，林果多數鞋款使用較薄的皮革，透氣舒適度較佳。<br><br>
<strong>皮鞋穿久會不會臭？</strong> 基本上不會，因為鞋面是真牛皮，皮革有毛孔可以排出汗水濕氣；皮底鞋透氣度最好。若使用頻繁（如工作鞋），建議準備兩雙交替穿。`},
    {type:'quiz', q:'情境題：客人擔心「常穿皮鞋工作，會不會很臭？」比較好的回答方向是？',
      options:['會啊，皮鞋本來就比較悶熱','基本上不會，真牛皮的皮革有毛孔可以排出汗水濕氣，若使用頻繁建議準備兩雙交替穿更能改善','不會，因為我們的鞋子有除臭噴霧','這個問題不重要，可以不用回答'],
      correct:1, exp:'用材質特性（真皮毛孔透氣）建立信心，同時給出實用建議（頻繁使用時兩雙交替穿），是比較完整、專業的回答方式。'}
  ]
},

// ============================================================
// State & rendering
// ============================================================
let progressCache = {};
let currentModule = null;
let currentStepIdx = 0;
let answers = {}; // stepIdx -> {picked, correct}

const $ = (id) => document.getElementById(id);

async function loadProgress() {
  const email = getEmail();
  if (!email || !GAS_URL) return;
  try {
    const res = await fetch(GAS_URL + '?action=getProgress&email=' + encodeURIComponent(email));
    const data = await res.json();
    if (data && data.success) progressCache = data.progress || {};
  } catch (e) { console.warn('讀取學習進度失敗', e); }
  renderModuleGrid();
}

function renderModuleGrid() {
  const grid = $('module-grid');
  grid.innerHTML = '';
  MODULES.forEach(m => {
    const p = progressCache[m.id];
    const card = document.createElement('div');
    card.className = 'module-card';
    card.innerHTML = `
      <div class="module-icon">${m.icon}</div>
      <div class="module-title">${m.title}</div>
      <div class="module-desc">${m.desc}</div>
      <div class="module-badge ${p ? 'done' : ''}">${p ? ('✅ 已完成 · ' + p.percent + '%') : '尚未開始'}</div>
    `;
    card.addEventListener('click', () => startModule(m.id));
    grid.appendChild(card);
  });
}

function startModule(id) {
  currentModule = MODULES.find(m => m.id === id);
  currentStepIdx = 0;
  answers = {};
  $('module-grid').style.display = 'none';
  $('intro-text').style.display = 'none';
  $('result-wrap').classList.remove('show');
  $('lesson-wrap').classList.add('show');
  renderStep();
}

function backToList() {
  $('lesson-wrap').classList.remove('show');
  $('result-wrap').classList.remove('show');
  $('module-grid').style.display = 'grid';
  $('intro-text').style.display = 'block';
  renderModuleGrid();
}

function renderStep() {
  const steps = currentModule.steps;
  const step = steps[currentStepIdx];
  $('progress-label').textContent = (currentStepIdx + 1) + ' / ' + steps.length;
  $('progress-fill').style.width = Math.round(((currentStepIdx) / steps.length) * 100) + '%';

  const card = $('step-card');
  if (step.type === 'card') {
    card.innerHTML = `
      <div class="step-kicker">${currentModule.title}</div>
      <div class="step-title">${step.title}</div>
      <div class="step-body">${step.body}</div>
      <div class="step-nav">
        <button class="btn btn-ghost" id="btn-prev" ${currentStepIdx===0?'disabled':''}>上一步</button>
        <button class="btn btn-primary" id="btn-next">${currentStepIdx===steps.length-1?'完成模組':'下一步'}</button>
      </div>`;
    $('btn-next').addEventListener('click', advanceStep);
    $('btn-prev').addEventListener('click', prevStep);
  } else {
    const prevAnswer = answers[currentStepIdx];
    card.innerHTML = `
      <div class="step-kicker">🧠 小測驗</div>
      <div class="step-title">${step.q}</div>
      <div class="quiz-options" id="quiz-options"></div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <div class="step-nav">
        <button class="btn btn-ghost" id="btn-prev" ${currentStepIdx===0?'disabled':''}>上一步</button>
        <button class="btn btn-primary" id="btn-next" disabled>${currentStepIdx===steps.length-1?'完成模組':'下一步'}</button>
      </div>`;
    const optWrap = $('quiz-options');
    step.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'quiz-opt';
      b.textContent = opt;
      b.addEventListener('click', () => selectAnswer(i));
      optWrap.appendChild(b);
    });
    $('btn-next').addEventListener('click', advanceStep);
    $('btn-prev').addEventListener('click', prevStep);
    if (prevAnswer) showQuizFeedback(prevAnswer.picked, true);
  }
}

function selectAnswer(pickedIdx) {
  const step = currentModule.steps[currentStepIdx];
  if (answers[currentStepIdx]) return; // already answered
  const isCorrect = pickedIdx === step.correct;
  answers[currentStepIdx] = { picked: pickedIdx, correct: isCorrect };
  showQuizFeedback(pickedIdx, false);
}

function showQuizFeedback(pickedIdx, isReplay) {
  const step = currentModule.steps[currentStepIdx];
  const opts = document.querySelectorAll('#quiz-options .quiz-opt');
  opts.forEach((b, i) => {
    b.disabled = true;
    if (i === step.correct) b.classList.add('correct');
    else if (i === pickedIdx) b.classList.add('wrong');
  });
  const isCorrect = pickedIdx === step.correct;
  const fb = $('quiz-feedback');
  fb.className = 'quiz-feedback show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = `<div class="fb-head">${isCorrect ? '✅ 答對了！' : '❌ 答錯了'}</div><div>${step.exp}</div>`;
  $('btn-next').disabled = false;
}

function prevStep() {
  if (currentStepIdx === 0) return;
  currentStepIdx--;
  renderStep();
}

function advanceStep() {
  const steps = currentModule.steps;
  if (currentStepIdx < steps.length - 1) {
    currentStepIdx++;
    renderStep();
  } else {
    finishModule();
  }
}

function finishModule() {
  const steps = currentModule.steps;
  const quizSteps = steps.map((s,i)=>({s,i})).filter(x => x.s.type === 'quiz');
  const total = quizSteps.length;
  const score = quizSteps.filter(x => answers[x.i] && answers[x.i].correct).length;
  const percent = total ? Math.round((score/total)*100) : 100;

  $('lesson-wrap').classList.remove('show');
  $('result-wrap').classList.add('show');
  $('result-emoji').textContent = percent >= 80 ? '🎉' : (percent >= 50 ? '💪' : '📖');
  $('result-title').textContent = currentModule.title + ' · 完成！';
  $('result-score').innerHTML = score + ' / ' + total + '<small> 題答對</small>';
  $('result-sub').textContent = percent >= 80
    ? '表現很棒，這個模組你已經掌握得不錯了！'
    : (percent >= 50 ? '基本掌握了，建議重新測驗一次加深印象。' : '建議重新讀過一次，把答錯的觀念再確認清楚。');

  const email = getEmail();
  if (email && GAS_URL) {
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'recordProgress', email,
        moduleId: currentModule.id, moduleTitle: currentModule.title,
        score, total
      })
    }).then(() => { progressCache[currentModule.id] = { moduleTitle: currentModule.title, score, total, percent }; })
      .catch(e => console.warn('進度記錄失敗', e));
  }
}

$('lesson-exit').addEventListener('click', backToList);
$('btn-back-list').addEventListener('click', backToList);
$('btn-retry').addEventListener('click', () => startModule(currentModule.id));

loadProgress();
</script>
