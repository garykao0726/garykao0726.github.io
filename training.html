<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林果良品｜林果學苑．商品知識訓練</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
:root{
  --green:#284234;--dark:#002721;--sand:#E2CEB9;--sand-light:#F5EDE3;
  --rust:#A54A1A;--gray-pink:#CFA294;--brown:#8D5531;
  --bg:#F5EDE3;--surface:#fff;--surface2:#FAF5EF;
  --border:rgba(40,66,52,.10);--border2:rgba(40,66,52,.22);
  --text:#284234;--text-muted:#b09a88;
  --pos:#388E3C;--neg:#D32F2F;--warn:#F57C00
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;line-height:1.7}

/* ── Header ── */
.hdr{position:sticky;top:0;z-index:100;background:var(--green);height:54px;
  display:flex;align-items:center;justify-content:space-between;padding:0 2rem}
.brand{display:flex;align-items:center;gap:14px}
.brand-name{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.1em;color:var(--sand)}
.brand-sep{width:1px;height:16px;background:rgba(226,206,185,.3)}
.brand-sub{font-size:10px;color:var(--gray-pink);font-family:'Space Mono',monospace}
.hdr-r{display:flex;align-items:center;gap:14px}
.hdr-back{font-size:11px;color:var(--gray-pink);text-decoration:none;font-family:'Space Mono',monospace;
  border:1px solid rgba(226,206,185,.25);padding:5px 12px;border-radius:14px;transition:.2s;cursor:pointer;background:none}
.hdr-back:hover{background:rgba(226,206,185,.1);color:var(--sand)}

/* ── Hero ── */
.hero{background:var(--green);padding:3rem 1.5rem 2.6rem;text-align:center;
  border-bottom:1px solid rgba(226,206,185,.15)}
.hero-eyebrow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:5px;
  color:var(--gray-pink);text-transform:uppercase;margin-bottom:18px}
.hero-rule{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
.hero-line{width:48px;height:1px;background:rgba(226,206,185,.3)}
.hero-icon{font-size:22px}
.hero-title{font-family:'Noto Sans TC',sans-serif;font-size:clamp(22px,3.4vw,32px);
  font-weight:700;color:var(--sand);letter-spacing:.04em;line-height:1.25;margin-bottom:6px}
.hero-sub{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;
  color:rgba(207,162,148,.7);text-transform:uppercase}

/* ── Container ── */
.container{max-width:780px;margin:0 auto;padding:2.4rem 1.5rem 4rem}

/* ── Module grid ── */
.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.module-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;
  padding:22px 20px;cursor:pointer;transition:.18s;box-shadow:0 2px 10px rgba(40,66,52,.05);
  display:flex;flex-direction:column;gap:10px}
.module-card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 8px 22px rgba(40,66,52,.1)}
.module-icon{font-size:30px}
.module-title{font-size:15px;font-weight:700;color:var(--green)}
.module-desc{font-size:12px;color:var(--text-muted);line-height:1.6;flex:1}
.module-badge{align-self:flex-start;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.5px;
  padding:4px 10px;border-radius:12px;background:var(--sand-light);color:var(--brown);border:1px solid var(--border)}
.module-badge.done{background:rgba(56,142,60,.12);color:var(--pos);border-color:rgba(56,142,60,.3)}
@media(max-width:560px){.module-grid{grid-template-columns:1fr}}

/* ── Lesson runner ── */
.lesson-wrap{display:none}
.lesson-wrap.show{display:block}
.progress-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.progress-bar-track{flex:1;height:6px;border-radius:4px;background:var(--sand-light);overflow:hidden}
.progress-bar-fill{height:100%;background:var(--green);border-radius:4px;transition:width .3s ease}
.progress-step-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted);white-space:nowrap}
.lesson-exit{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted);
  background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.step-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;
  padding:30px 28px;box-shadow:0 4px 18px rgba(40,66,52,.06);animation:slide-in .3s ease}
@keyframes slide-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step-kicker{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;
  color:var(--gray-pink);text-transform:uppercase;margin-bottom:10px}
.step-photo{width:100%;max-height:280px;object-fit:cover;border-radius:14px;margin-bottom:18px;
  display:block;box-shadow:0 4px 14px rgba(40,66,52,.1)}
.step-photo-cap{font-size:11px;color:var(--text-muted);margin:-10px 0 18px;font-family:'Space Mono',monospace;letter-spacing:.5px}
.article-section{margin-top:22px}
.article-section:first-of-type{margin-top:20px}
.article-section-title{font-size:16px;font-weight:700;color:var(--green);margin-bottom:12px}
.article-divider{height:1px;background:var(--border);margin:26px 0}
.step-title{font-size:19px;font-weight:700;color:var(--green);margin-bottom:16px;line-height:1.5}
.step-body{font-size:14.5px;line-height:1.9;color:var(--text)}
.step-body strong{color:var(--rust)}

.table-scroll{overflow-x:auto;margin:12px 0;border-radius:10px;border:1px solid var(--border)}
.ref-table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
.ref-table th,.ref-table td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:center}
.ref-table th{background:var(--sand-light);color:var(--green);font-weight:700;position:sticky;left:0}
.ref-table tr:last-child td{border-bottom:none}

.quiz-options{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.quiz-opt{text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;
  padding:13px 16px;font-size:13.5px;color:var(--text);cursor:pointer;transition:.15s;font-family:inherit;line-height:1.6}
.quiz-opt:hover:not(:disabled){border-color:var(--green);background:#fff}
.quiz-opt:disabled{cursor:default}
.quiz-opt.correct{border-color:var(--pos);background:rgba(56,142,60,.1);color:var(--pos);font-weight:700}
.quiz-opt.wrong{border-color:var(--neg);background:rgba(211,47,47,.08);color:var(--neg);font-weight:700}
.quiz-feedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.8;
  background:var(--sand-light);border:1px dashed var(--border2);display:none}
.quiz-feedback.show{display:block}
.quiz-feedback .fb-head{font-weight:700;margin-bottom:4px}
.quiz-feedback.correct-fb .fb-head{color:var(--pos)}
.quiz-feedback.wrong-fb .fb-head{color:var(--neg)}

.step-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.btn{font-family:'Noto Sans TC',sans-serif;font-size:13.5px;font-weight:700;border:none;border-radius:12px;
  padding:12px 24px;cursor:pointer;transition:.18s}
.btn-primary{background:var(--green);color:var(--sand)}
.btn-primary:hover{background:var(--dark)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:none;color:var(--text-muted);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--green);border-color:var(--green)}

/* ── Result screen ── */
.result-wrap{display:none;text-align:center}
.result-wrap.show{display:block}
.result-emoji{font-size:52px;margin-bottom:14px}
.result-title{font-size:20px;font-weight:700;color:var(--green);margin-bottom:8px}
.result-score{font-family:'Space Mono',monospace;font-size:38px;font-weight:700;color:var(--rust);margin:14px 0}
.result-score small{font-size:16px;color:var(--text-muted)}
.result-sub{font-size:13px;color:var(--text-muted);margin-bottom:26px}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.intro{text-align:center;color:var(--text-muted);padding:0 0 2rem;font-size:13px;line-height:1.9}
.intro strong{color:var(--green)}

.footer{border-top:1px solid var(--border);padding:1.6rem;text-align:center;
  font-family:'Space Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:1.5px}

@media(max-width:540px){
  .hdr{padding:0 1rem}
  .hero{padding:2.2rem 1rem 2rem}
  .container{padding:2rem 1rem 3rem}
  .step-card{padding:22px 18px}
}
</style>
</head>

<!-- Header -->
<div class="hdr">
  <div class="brand">
    <div class="brand-name">ORINGO</div>
    <div class="brand-sep"></div>
    <div class="brand-sub">Staff Academy</div>
  </div>
  <div class="hdr-r">
    <a href="/" class="hdr-back">← 中控中心</a>
  </div>
</div>

<!-- Hero -->
<div class="hero">
  <div class="hero-eyebrow">Partner Learning &amp; Quiz</div>
  <div class="hero-rule">
    <div class="hero-line"></div>
    <div class="hero-icon">🎓</div>
    <div class="hero-line"></div>
  </div>
  <div class="hero-title">林果學苑</div>

</div>

<div class="container">

  <div class="intro" id="intro-text">
    把<strong>商品知識手冊</strong>拆成一個個小知識點，讀完一小段就來一題小測驗。<br>

  <!-- 模組列表 -->
  <div class="module-grid" id="module-grid"></div>

  <div class="lesson-wrap" id="lesson-wrap">
    <div class="progress-top">
      <button class="lesson-exit" id="lesson-exit">← 返回模組列表</button>

      <div class="progress-step-label" id="progress-label">1 / 1</div>

  <!-- 結果畫面 -->
  <div class="result-wrap" id="result-wrap">

    <div class="result-actions">
      <button class="btn btn-ghost" id="btn-back-list">返回模組列表</button>
      <button class="btn btn-primary" id="btn-retry">重新測驗</button>

  </div>

</div>

<div class="footer">© 2026 ORINGO SHOES CO., LTD. · INTERNAL USE ONLY</div>

<script>
// ============================================================
// 林果學苑 — 進度記錄 API
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbybDRIBOBbjPMH43C5GKB83JsaND2hK0sMYHGkKxXvcLckQ-rVikaPYtHvsxdst7Z7g/exec';

function getEmail() {
  try {
    const s = JSON.parse(localStorage.getItem('oringo_auth_v1') || 'null');
    return (s && s.email) || '';
  } catch { return ''; }
}

// ============================================================
// 課程內容：第2冊 商品知識手冊
// ============================================================
const MODULES = [
{
  id:'brand', icon:'👞', title:'林果特色與鞋子構造', desc:'三大特色、各部位名稱、製鞋工藝、售後服務',
  steps:[
    {type:'card', title:'林果三大特色', body:`如果客人問你「你們家鞋子跟別人差在哪？」，記住這三句話就夠了：<br><br>
1️⃣ 楦頭是照<strong>台灣人的腳型</strong>開發的，不是直接套用國外版型<br>
2️⃣ 每一雙都是<strong>台灣師傅</strong>手工做出來的，不是產線量產<br>
3️⃣ 用的是<strong>皮革大底</strong>，不是便宜的合成材質<br><br>
這三句話講出來，客人馬上會感覺到你懂自己在賣什麼——這就是建立信任感最快的方式。`},
    {type:'quiz', q:'林果鞋的三大特色不包含以下哪一項？',
      options:['以台灣人的版型開發楦頭','由台灣師傅手工製作','全部改用進口機器大量量產','皮革大底鞋款'],
      correct:2, exp:'林果強調台灣楦頭＋台灣師傅手工＋皮革大底，並非強調機器量產。'},

    {type:'card', title:'認識港寶', photo:'assets/training/brand-anatomy.jpg', photoCap:'鞋子各部位名稱一次看懂',
      body:`鞋頭跟鞋跟為什麼可以撐住形狀、不會一穿就塌掉？秘密藏在裡面一層叫<strong>港寶</strong>的材質。它原本軟趴趴像張紙，師傅把它泡過甲苯、送進烤箱烘烤之後，才會變硬定型，撐起整雙鞋的骨架。<br><br>
但也因為這樣，港寶有個「天生的個性」：<strong>一旦定型後受外力硬壓或踢到，就再也回不去了</strong>。所以像是沒用鞋拔硬踩後跟、鞋頭去撞到機車停車架、或客人忍不住用力捏一捏測試軟硬——這些瞬間都是港寶最怕的時刻，遇到這樣的狀況，要老實告訴客人這是材質特性，不是能修好的小問題。`},
    {type:'quiz', q:'情境題：客人說「我鞋頭被摩托車停車架踢到凹了一個洞，可以修好嗎？」你會怎麼回答比較正確？',
      options:[
        '「沒問題，我們可以幫您敲回原狀」',
        '「這個位置是港寶，屬於受力後不可逆的結構材質，一旦凹陷無法修復；之後建議搭配鞋拔、留意尖銳物碰撞就能避免」',
        '「這是皮革本身的問題，應該是你保養不夠好」',
        '「這雙鞋壽命到了，建議直接買新的」'],
      correct:1, exp:'港寶泡甲苯烘烤定型後會變硬，受外力壓迫是材質特性造成的不可逆損傷，不是保養問題。要誠實說明原因，並提供預防建議（用鞋拔、避免尖銳物碰撞），不要隨口答應能修復，也不要把責任推給客人。'},

    {type:'card', title:'金油與中底鐵芯', body:`留意過林果鞋子的光澤嗎？鞋頭、鞋跟特別亮，中段卻沒那麼亮——這不是做工不均，是刻意的。鞋頭鞋跟上的是<strong>金油</strong>，一層薄薄的保護漆；中段因為走路時會一直彎折，上金油反而容易裂開，所以只輕輕上一層蠟就好。<br><br>
再往鞋子裡面看，藏著另一個關鍵角色：<strong>中底裡的鐵芯</strong>。這是一長條鐵片，從鞋腰(足弓)一路延伸到腳跟中心，撐住有跟鞋款起伏最大的地方，讓鞋子穿久了不容易垮、壽命更長。`},
    {type:'quiz', q:'為什麼林果的鞋子鞋頭、後跟摸起來會亮，但中段不會？',
      options:['中段刻意不上金油，因為走路彎折容易讓金油龜裂，只上薄薄一層蠟','中段沒有做完整工序，是品管疏漏','中段材質跟鞋頭不同，本來就不能上金油','這是消費者自己保養不當造成的'],
      correct:0, exp:'鞋頭、後跟走路時不太會彎折，適合上金油做保護與亮度；中段會隨走路彎折，上金油容易裂開，所以只上薄薄一層蠟。'},
    {type:'quiz', q:'中底裡的「鐵芯」主要功能是什麼？',
      options:['讓鞋子變重顯得比較高級','加強足弓/鞋腰起伏處的支撐力，延長鞋子壽命','防止鞋子進水','用來辨別是不是真皮'],
      correct:1, exp:'鐵芯是一長條鐵片，從鞋腰(足弓)延伸到腳跟中心，加強有跟鞋款起伏處的支撐效果。'},

    {type:'card', title:'大底與天皮', body:`鞋子最主要的結構是<strong>大底</strong>，材質可能是真皮、橡膠或發泡材質。而後腳跟那一小片橡膠，叫<strong>天皮</strong>，它的工作很單純但很重要——止滑，而且穿久磨平了可以單獨拆下來換，不用整雙大底一起換掉。<br><br>
🎁 記得跟客人說：林果紳士鞋類的皮底鞋款，天皮<strong>免費更換一次</strong>！門市可以現場換，寄送的話要自付來回運費，工作天大概10-15天。這個福利很多客人都不知道，主動講出來會讓他們對售後服務很有感。`},
    {type:'quiz', q:'天皮的主要作用，以及林果的售後服務是？',
      options:['止滑，紳士鞋皮底類提供免費更換一次','止滑，永久保固無限次免費更換','防水，需每次自費更換','純裝飾用，不影響鞋子壽命'],
      correct:0, exp:'天皮約可穿8~10個月，磨平後林果提供紳士鞋皮底類「免費更換一次」的服務，門市可現場更換。'},

    {type:'card', title:'製鞋工藝流程', photo:'assets/training/brand-glue.jpg', photoCap:'師傅手工上膠、貼合大底',
      body:`一雙鞋要出現在門市貨架上之前，其實走過了一段很長的路：先由開發鞋楦師傅做出楦頭，接著畫版、開發樣品，再劃皮裁剪，縫製鞋面內裡，拉幫時加入港寶、貼合中底送進烤箱定型，然後拔釘、打粗、上膠，處理大底，最後裝鞋墊、去漬、烘吹、推油才算完工。<br><br>
數十年經驗的台灣師傅，一雙皮底鞋要經手<strong>100多道工序</strong>，前前後後<strong>45–60天</strong>。下次客人問「怎麼這麼久」，你就可以把這段故事講給他聽。`},
    {type:'quiz', q:'一雙皮底鞋從開始製作到完成，大約需要多久時間？',
      options:['7-10天','20-30天','45-60天','超過半年'],
      correct:2, exp:'一雙皮底鞋以100多道製作步驟完成，從劃皮、縫製鞋面、拉幫、作底、脫楦…等，約需45-60天的製作期。'},

    {type:'card', title:'鞋底材質比較', body:`客人猶豫該選哪種底時，其實是在三種個性裡做取捨：<br><br>
<strong>皮底</strong>像文青，透氣、輕、還防靜電，缺點是容易滑、比較怕潮發霉——義大利進口的高質感母牛背皮做的。<br>
<strong>膠底</strong>像工作夥伴，耐磨止滑最實在，代價是重一點——每一雙都做過拉力測試，超過國家標準2倍以上。<br>
<strong>EVA泡棉</strong>像羽量級選手，輕到幾乎感覺不到重量，但消耗比較快，通常會搭配橡膠底一起成型來補強耐磨度。<br><br>
<div class="table-scroll"><table class="ref-table">
<tr><th>材質</th><th>優點</th><th>缺點</th><th>備註</th></tr>

    {type:'quiz', q:'情境題：客人常在下雨天通勤，很擔心止滑問題，你會優先推薦哪種鞋底？',
      options:['皮底，因為比較有質感','膠底，耐磨止滑，較適合雨天通勤的止滑需求','EVA泡棉，因為最輕','三種都一樣，沒有差別'],
      correct:1, exp:'膠底耐磨止滑，雖然比皮底重，但更適合雨天通勤這類重視止滑的情境；皮底透氣輕巧但容易滑、易發霉，可依客人的使用情境做取捨建議。'},

    {type:'card', title:'售後服務總整理', body:`客人下單前最擔心的三件事，林果都幫他們想好了：<br><br>
買錯尺碼怎麼辦？網購<strong>14天鑑賞期</strong>內，只要沒落地、沒人為破壞，<strong>免費換一次</strong>尺碼就好（店面購買要親自到店換）。<br><br>
用了品質有問題怎麼辦？全系列<strong>一年保固</strong>，只要不是自然磨耗或人為弄壞的，我們都檢修。<br><br>
穿久磨到天皮怎麼辦？磨平了直接<strong>免費維修一次</strong>就好，不用整雙報廢。<br><br>
這三句話，是你面對猶豫不決客人時最有力的臨門一腳。`},
    {type:'quiz', q:'網路購買的客人，尺碼不合的免費更換期限是幾天？',
      options:['7天','14天','30天','無期限，隨時都能換'],
      correct:1, exp:'網購客人在14天鑑賞期內，如尺碼不符、新品瑕疵，且無落地或人為破壞，可免費更換一次。'},

    {type:'card', title:'常見Q&A：黏合鞋與生膠底', body:`有些客人一聽到「用黏的」，直覺反應是「那應該很容易壞吧？」——這時候別急著否認，先讓數字說話：林果的鞋子都做過拉力測試，強度<strong>超過國家標準2倍以上</strong>，只要避免長期泡水、定期更換天皮，不會有開口的問題。<br><br>
另一個常被問到的是生膠底。生膠是沒煉過的橡膠，摸起來軟，但夏天一熱就會黏黏的，其實不太適合台灣這種亞熱帶氣候。林果的皮鞋跟休閒鞋用的都是<strong>煉過的橡膠大底</strong>，密度紮實，耐磨度也更好。`},
    {type:'quiz', q:'情境題：客人問「你們黏合的鞋是不是比較容易壞掉？」你的回答應該是？',
      options:['對啊，黏的比較不耐用，建議選車縫的款式','我們的鞋子都經過超過國家標準2倍以上的拉力測試，只要避免長期泡水、定期更換天皮，不會有開口的問題','不清楚，要問廠長才知道','黏合鞋完全不會壞，可以放心亂穿'],
      correct:1, exp:'要用具體的數據（拉力測試超過國家標準2倍以上）建立信任，同時誠實提醒正確的保養方式（避免長期泡水、定期更換天皮），而不是模糊帶過或誇大。'},

    {type:'card', title:'常見Q&A：磨腳與皮革透氣度', body:`<strong>手工鞋不會磨腳嗎？</strong> 磨腳最常見的兩個原因：①鞋子太大或太小，無法完整包覆腳型。②皮革較厚或經過額外塗料處理，雖然不易進水但較不透氣、較硬。台灣氣候與腳型下，林果多數鞋款使用較薄的皮革，透氣舒適度較佳。<br><br>
<strong>皮鞋穿久會不會臭？</strong> 基本上不會，因為鞋面是真牛皮，皮革有毛孔可以排出汗水濕氣；皮底鞋透氣度最好。若使用頻繁（如工作鞋），建議準備兩雙交替穿。`},
    {type:'quiz', q:'情境題：客人擔心「常穿皮鞋工作，會不會很臭？」比較好的回答方向是？',
      options:['會啊，皮鞋本來就比較悶熱','基本上不會，真牛皮的皮革有毛孔可以排出汗水濕氣，若使用頻繁建議準備兩雙交替穿更能改善','不會，因為我們的鞋子有除臭噴霧','這個問題不重要，可以不用回答'],
      correct:1, exp:'用材質特性（真皮毛孔透氣）建立信心，同時給出實用建議（頻繁使用時兩雙交替穿），是比較完整、專業的回答方式。'}
  ]
},
{
  id:'construction', icon:'🧵', title:'鞋子成型結構', desc:'布雷克、固特異、攀幫、拉幫、摩卡森五大結構',
  steps:[
    {type:'card', title:'製鞋流程簡述', photo:'assets/training/construction-flow.jpg', photoCap:'車縫台前，師傅正在組合鞋面',
      body:`從一片皮革變成一雙鞋，要走過畫料、取料裁斷、削皮、車縫組合、攀楦、貼合、底車縫、後處理這一長串工序。這堂課要講的「成型結構」，其實只回答一個問題：<strong>鞋面跟鞋底到底是怎麼固定在一起的？</strong><br><br>
答案分成兩大派：「有車縫線」跟「無車縫線(直接黏貼)」。你接下來會發現，這個選擇不只是做法不同，直接決定了一雙鞋耐不耐穿、腳感軟不軟、將來能不能換底。`},

    {type:'card', title:'布雷克結構 Blake construction', photo:'assets/training/construction-blake-diagram.jpg', photoCap:'鞋面／中底／大底一起車縫的斷面圖',
      body:`第一種結構的名字，來自1856年發明車底機的 Lyman Reed Blake。做法很直接：<strong>把鞋面、中底、大底片疊在一起，一次車縫</strong>，底部只做一道車線，所以整體特別輕薄。沿條純粹是裝飾用，寬窄都可以自由設計。<br><br>

    {type:'quiz', q:'布雷克結構的優點是？',

    {type:'card', title:'林果男鞋的布雷克結構（改良版）', photo:'assets/training/construction-blake-oringo.jpg', photoCap:'師傅檢查大底邊緣的暗溝車縫',
      body:`布雷克結構容易進水的老問題，林果師傅想到了解法：<strong>先手工剖開大底、做出一層夾層</strong>，把鞋面、中底、大底車縫在這條「暗溝」裡，車縫完再把底層皮革貼合回去、把縫線整個埋起來。<br><br>

    {type:'quiz', q:'情境題：客人問「你們家男鞋皮底摸起來怎麼看不到車縫線？」正確回答是？',
      options:['因為根本沒有車縫，是純黏合的','因為師傅手工剖開大底做出夾層，車縫在暗溝內再把底層皮革貼合埋藏縫線，解決一般布雷克容易進水的問題','因為這是固特異結構','看不到縫線代表是品質瑕疵，建議送修'],
      correct:1, exp:'這是林果改良版布雷克結構的重點：暗溝車縫＋貼合埋藏縫線，兼顧不外露的外觀與防止進水。'},

    {type:'card', title:'固特異結構 Goodyear construction', body:`這是最古老的結構法之一，命名來自1870年代發明合縫肋條縫紉機的 Charles Goodyear, Jr.。做法比布雷克更講究：鞋面跟中底的垂直肋條先跟沿條內側車縫、貼合大底片，沿條外側再車縫一次——<strong>底部總共做兩道車縫</strong>，而且沿條要寬6mm以上才夠機台操作。<br><br>

    {type:'quiz', q:'以下哪一項描述是正確的？',

    {type:'card', title:'攀幫結構 Lasting construction（貼底）', photo:'assets/training/construction-lasting.jpg', photoCap:'鞋面攀附在中底板下，準備上膠貼合',
      body:`隨著膠水的黏性跟強度越做越好，工廠開始用一個更快的做法：保留「把鞋面攀附在中底板下固定」這個最原始的動作，但<strong>用膠水取代車縫</strong>當主要固定方式。<br><br>

    {type:'card', title:'保養品牌背景', body:`門市裡其實同時擺著三個保養品牌的故事：<br><br>

<strong>哥倫布斯（日本）</strong>1919年創立(日東皮革塗料工業起家)，特色是不斷創新、保養品項做得很多元。<br><br>
<strong>林果良品</strong>自己的保養品，適合全林果鞋款，以天然成分為主——鞋乳其實是找做臉部保養品的廠商做的，亮光蠟則以棕梠油為主。定位是最簡單、自己在家就能上手的<strong>入門款</strong>，價位介於哥倫布斯跟莎菲爾之間。`},
    {type:'quiz', q:'情境題：客人問「你們自己的鞋乳跟外面買的比起來怎麼樣？」較好的回答方向是？',
      options:['我們的比較好，因為比較貴','林果良品保養品以天然成分為主，是最基礎簡單、全林果鞋款都適用的入門款，價位介於哥倫布斯與莎菲爾之間','都一樣沒差','我們沒有自己的保養品可以介紹'],
      correct:1, exp:'用具體定位(天然成分、入門款、價位區間)回答，比空泛說「比較好」更專業、更有說服力。'},

    {type:'card', title:'工具類產品', photo:'assets/training/care-brush.jpg', photoCap:'山毛櫸木＋白馬鬃毛的除塵拋光刷',
      body:`保養第一步永遠是工具。<strong>白馬鬃毛舉刷</strong>用山毛櫸木配白馬鬃毛做成，除塵、拋光鞋蠟都靠它——選白色鬃毛是有原因的，比較容易看清楚刷上去的鞋蠟顏色。<br><br>
麂皮、牛巴哥、反毛皮這類鞋面，要換成<strong>麂皮清潔刷</strong>刷掉表面灰塵；橡膠短刷則像生膠一樣，專門對付麂皮的髒污。清潔完要拋光滋潤，靠的是<strong>純棉擦拭布</strong>——記得別用上漿或有彈性的布，太利反而傷皮面。<br><br>
鞋子沒穿的時候呢？塞一支<strong>雪松原木鞋撐</strong>，吸濕、防霉、還帶點香氣，也能避免皮底大底收縮變形。用久了鞋撐吸飽濕氣，曬曬太陽或用#600細砂紙輕拋一下就能恢復效果。<br><br>
⚠️ 用麂皮刷有個小訣竅：不要太用力往下壓，先固定一個方向刷，刷完再換另一個方向。`},
    {type:'quiz', q:'麂皮鞋款要用哪一種工具清潔比較合適？',
      options:['白馬鬃毛舉刷','麂皮清潔刷','純棉擦拭布沾水','亮光蠟'],
      correct:1, exp:'麂皮、牛巴哥、反毛皮鞋面要用麂皮清潔刷，力道不能太大，先刷一個方向再刷另一個方向。'},

    {type:'card', title:'清潔類產品', photo:'assets/training/care-cleaner.jpg', photoCap:'質地溫和的皮革清潔乳',
      body:`<strong>生膠</strong>遇熱會變軟，靠摩擦力把麂皮、帆布皮上的髒污帶起來，連膠類、口香糖都清得掉。<strong>麂皮橡皮擦</strong>原理類似，髒污會依附在橡皮擦碎屑裡自然剝落。日常清潔則交給<strong>皮革清潔乳</strong>，含水、油脂跟界面活性劑，溫和又有制菌效果，是乳化清潔的做法。<br><br>
⚠️ 這裡有個容易被忽略的心法：<strong>寧可清潔得不夠乾淨，也不要清潔過頭把皮革用壞</strong>——大概清潔2次就好，不用一直重複。也要提醒客人別自己拿酒精來擦，酒精是有機溶劑，會揮發，反而比較傷皮革。`},
    {type:'quiz', q:'關於清潔類產品的教學重點，以下何者正確？',
      options:['清潔次數越多越乾淨越好','寧可用不乾淨也不要用壞，約清潔2次即可，不要過度清潔','建議用酒精清潔最安全','清潔類產品可以取代滋養保養'],
      correct:1, exp:'清潔的教學重點是「不要強求」，約清潔2次即可，過度清潔反而傷皮革；酒精含有機溶劑，比較傷皮革，不建議常用。'},

    {type:'card', title:'保養類產品(滋養)', photo:'assets/training/care-nourish.jpg', photoCap:'滋養乳的質地要輕薄均勻上',
      body:`清潔完的皮革會需要「喝水」，這時候就靠滋養類產品。<strong>皮革滋養鮭魚油</strong>是滋養效果最強的一款，特別推薦拿來厚敷保養皮底大底。<strong>皮革滋養乳</strong>則溫和一些，含棕櫚油、椰子油、純橄欖乳霜、雪松精油，還帶點潤色效果。<br><br>
⚠️ 要提醒客人的是：鞋油類產品上完之後，<strong>就不能再上蠟、也不能上防水噴霧了</strong>（會沾不上去），而且上太多、沒乾就容易黏灰塵——鞋油本身也沒有防水效果，這點常被誤會，一定要講清楚。`},
    {type:'quiz', q:'情境題：客人剛買了鮭魚油要保養鞋面，你會提醒他什麼？',
      options:['鮭魚油上完後還可以馬上上防水噴霧','鮭魚油上完後不建議再上蠟或防水噴霧(無法附著)，且要避免過量，沒乾前容易沾黏灰塵','鮭魚油完全不能用在皮底','鮭魚油可以每天大量塗抹沒關係'],
      correct:1, exp:'鞋油類(含鮭魚油)上完後無法再附著蠟或防水噴霧，且避免上過量，沒乾前容易沾黏灰塵；鮭魚油反而非常推薦厚敷用在保養皮底大底。'},

    {type:'card', title:'補色拋光類產品', photo:'assets/training/care-wax.jpg', photoCap:'蜜蠟開罐，準備補色拋光',
      body:`鞋子穿久掉色、想找回光澤，就是這一類產品的舞台。<strong>皮革鞋蠟</strong>用蜂蠟、油脂、溶劑做的，補色之餘還帶一點防水跟光澤。想快速打亮的話用<strong>快速亮光蠟</strong>，膏狀質地能很快形成蠟膜，只是延展性、防護性都比較弱。<br><br>
真的要做出鏡面效果，就要靠<strong>鏡面亮光蠟</strong>（蜂蠟、棕櫚蠟、松節油），防刮傷之外還能補色防水；<strong>皮革亮光蠟</strong>則多加了雪松精油抗菌，一樣防刮、補色、防水。<br><br>
💡 記一個原理就好：蜂蠟會在鞋面形成一層蠟膜，這層膜就是保護力的來源。`},
    {type:'quiz', q:'哪一種補色拋光產品「延展性、防護性較低」，比較適合快速應急打亮？',
      options:['快速亮光蠟','鏡面亮光蠟','皮革亮光蠟','蜂蠟膏'],
      correct:0, exp:'快速亮光蠟以高成分蠟特殊比例調配成膏狀，能快速形成蠟膜打亮，但延展性、防護性都比較低，比較適合應急用途，不能取代完整的保養流程。'},

    {type:'card', title:'防水類產品', photo:'assets/training/care-waterproof.jpg', photoCap:'噴罐要距離鞋面30公分',
      body:`雨天前噴一下最安心，但這裡藏著一個最常被誤會的觀念。<strong>皮革防水噴霧</strong>靠氟素樹脂、溶劑針對材質做出防潑水效果，還兼防霜雪；<strong>防水防污噴霧</strong>則是氟樹脂、溶劑，對各種材質都有防潑水效果。<br><br>
使用方式：距離鞋面<strong>30公分</strong>，在通風或室外空間噴<strong>2~3層</strong>，中間間隔3~5分鐘讓它吸收。<br><br>
⚠️ 一定要跟客人講清楚：<strong>這是「防潑水」，不是完全防水</strong>——下雨天走一下沒問題，但泡在水裡一樣會濕。少量多次噴、預防勝於治療，才是正確心態。`},
    {type:'quiz', q:'跟客人介紹防水噴霧時，以下哪個說法正確？',
      options:['這是完全防水，下雨天泡水也沒關係','這是防潑水效果，少量多次使用，並非完全防水','噴的距離越近效果越好','噴一次就永久有效，不用再補噴'],
      correct:1, exp:'防水噴霧的正確說法是「防潑水」，不是完全防水；使用時要距離鞋面30公分、少量多次(2~3層，間隔3~5分鐘)，過度期待防水效果容易造成客人誤會與客訴。'},

    {type:'card', title:'保養5步驟與銷售話術心法', body:`把前面幾類產品串起來，完整的<strong>皮鞋保養5步驟</strong>長這樣：① 狀況評估 → ② 除塵清潔 → ③ 保養滋潤 → ④ 補色打亮 → ⑤ 鏡面拋光。<br><br>
貫穿這5步的心法就一句話：<strong>不要先入為主、確實做好不強求、適量不過量、預防勝於治療、前後一致溫和進行</strong>。<br><br>
面對客人，話術也有一套順序——先問一句「平常有保養習慣嗎？」<br>
→ 有興趣的，就用你剛學的專業知識，依他的需求推薦組合<br>
→ 沒興趣的，別硬推銷，先把保養的概念傳遞出去就好（記得提醒林果有提供免費的基本保養）`},

    {type:'card', title:'三種銷售組合', body:`同樣是保養，不同客人要推薦不同深度的組合：<br><br>
<strong>簡易版(懶人推薦)</strong>：清潔(馬毛刷) + 防護(防水噴霧)。這是給<strong>不常保養、生活忙碌</strong>的客人，重點是別重複推銷他已經買過的東西。<br><br>
<strong>基礎版</strong>：清潔 + 滋養(適當油質維持彈性) + 防護，適合想再多做一點的一般客人。<br><br>
<strong>進階版</strong>：清潔(含清潔露徹底去舊) + 滋養 + 補色(蜜蠟) + 防護(亮光蠟多層)，這是留給<strong>要出席重要場合、或對保養本身有強烈興趣</strong>的客人的完整組合。`},
    {type:'quiz', q:'情境題：客人說「我平常很少保養鞋子，也沒什麼興趣」，你會推薦哪一種銷售組合？',
      options:['進階版，因為比較完整周全','簡易版，針對不常保養/生活忙碌的客群，先建立基本保養習慣','什麼都不用推薦，直接結束對話','基礎版一定要包含補色步驟'],
      correct:1, exp:'銷售組合要對應客群需求，對不常保養、沒興趣的客人推銷太複雜的進階版反而造成壓力，簡易版才是符合對方需求、能建立基本保養習慣的起點。'},

    {type:'card', title:'常見問題FAQ', body:`把門市最常被問到的幾個狀況整理起來：<br><br>
<strong>「鞋子發霉了怎麼辦？」</strong>先刷除表層霉菌，用75%消毒酒精或皮革清潔露擦拭陰乾，反覆做到菌絲清乾淨，最後再做一次完整鞋油保養。<br><br>
<strong>「淋雨之後呢？」</strong>先用布把水擦乾淨，放通風處或除濕機旁邊陰乾；如果留下水痕，先用微濕布或清潔劑擦過再徹底乾燥、做完整保養。<br><br>
<strong>「已經修過一次的鞋面，可以再送修嗎？」</strong>不建議。維修要經過打磨，鞋子已經穿了一段時間，皮面可能因為二次維修變得更脆弱，比較好的建議是讓它穿到自然汰換。<br><br>
<strong>「鞋面被機車油漬或油漆滴到？」</strong>小範圍可以試試細砂紙或生膠擦清除後補蠟；範圍大的話，老實告訴客人真的處理不了。`},
    {type:'quiz', q:'情境題：客人的皮鞋不小心發霉了，你會怎麼建議？',
      options:['直接說沒救了，建議買新的','先刷除表層霉菌，再用75%酒精或皮革清潔露擦拭陰乾，反覆直到去除後再做鞋油保養','泡水清洗最乾淨','用吹風機用力吹乾就好，不用特別處理'],
      correct:1, exp:'發霉處理要先刷除菌絲、用酒精或清潔露擦拭陰乾，反覆直到去除乾淨，最後再做鞋油保養，不是直接放棄或用錯方法(如泡水)。'},
    {type:'quiz', q:'已經送過一次鞋面維修的鞋子，客人問可不可以再送第二次維修？',
      options:['可以無限次維修沒問題','不建議，因維修需要打磨，鞋子用越久皮面可能因二次維修變得更脆弱，建議可以穿到自然汰換','一定要直接拒絕，不能再維修','這個問題不重要，可以不用理會'],
      correct:1, exp:'維修會經過打磨程序，鞋子已使用較長時間若再次維修，皮面可能變得更脆弱，建議讓客人了解風險、可以選擇穿到自然汰換。'}
  ]
},

];

// ============================================================
// State & rendering
// ============================================================
let progressCache = {};
let currentModule = null;
let currentPhase = 'read'; // 'read' (讀完整段知識) 先於 'quiz' (再一次考完整份測驗)
let readSteps = [];
let quizSteps = [];
let readIdx = 0;
let quizIdx = 0;
let answers = {}; // quizIdx -> {picked, correct}

const $ = (id) => document.getElementById(id);

async function loadProgress() {
  const email = getEmail();
  if (!email || !GAS_URL) return;
  try {
    const res = await fetch(GAS_URL + '?action=getProgress&email=' + encodeURIComponent(email));
    const data = await res.json();
    if (data && data.success) progressCache = data.progress || {};
  } catch (e) { console.warn('讀取學習進度失敗', e); }
  renderModuleGrid();
}

function renderModuleGrid() {
  const grid = $('module-grid');
  grid.innerHTML = '';
  MODULES.forEach(m => {
    const p = progressCache[m.id];
    const card = document.createElement('div');
    card.className = 'module-card';
    card.innerHTML = `
      <div class="module-icon">${m.icon}</div>
      <div class="module-title">${m.title}</div>
      <div class="module-desc">${m.desc}</div>
      <div class="module-badge ${p ? 'done' : ''}">${p ? ('✅ 已完成 · ' + p.percent + '%') : '尚未開始'}</div>
    `;
    card.addEventListener('click', () => startModule(m.id));
    grid.appendChild(card);
  });
}

function startModule(id) {
  currentModule = MODULES.find(m => m.id === id);
  readSteps = currentModule.steps.filter(s => s.type === 'card');
  quizSteps = currentModule.steps.filter(s => s.type === 'quiz');
  currentPhase = 'read';
  readIdx = 0;
  quizIdx = 0;
  answers = {};
  $('module-grid').style.display = 'none';
  $('intro-text').style.display = 'none';
  $('result-wrap').classList.remove('show');
  $('lesson-wrap').classList.add('show');
  renderStep();
}

function backToList() {
  $('lesson-wrap').classList.remove('show');
  $('result-wrap').classList.remove('show');
  $('module-grid').style.display = 'grid';
  $('intro-text').style.display = 'block';
  renderModuleGrid();
}

// 先讓夥伴讀完一個模組「完整的知識內容」，讀完才進入測驗階段一次考完，
// 避免邊讀邊考只是靠短期記憶作答、讀完就忘、知識也學得零碎。
function renderStep() {
  if (currentPhase === 'read') renderReadStep();
  else renderQuizStep();
}

// 讀的階段不再一張卡片一張卡片翻頁——整個模組的知識內容一次全部顯示成一篇完整
// 文章，讓夥伴用「看文章」的方式從頭讀到尾，讀完才進入測驗，而不是每讀一小段
// 就要點一次「下一步」翻頁。
function renderReadStep() {
  $('progress-label').textContent = '閱讀完整內容';
  $('progress-fill').style.width = '8%';

  const sectionsHtml = readSteps.map(step => {
    const photoHtml = step.photo
      ? `<img class="step-photo" src="${step.photo}" alt="${step.title}" loading="lazy">${step.photoCap ? '<div class="step-photo-cap">📷 '+step.photoCap+'</div>' : ''}`
      : '';
    return `
      <div class="article-section">
        <div class="article-section-title">${step.title}</div>
        ${photoHtml}
        <div class="step-body">${step.body}</div>
      </div>`;
  }).join('<div class="article-divider"></div>');

  const card = $('step-card');
  card.innerHTML = `
    <div class="step-kicker">${currentModule.title} · 閱讀完整內容（共 ${readSteps.length} 段，讀完才開始測驗）</div>
    <div class="step-title">${currentModule.title}</div>
    ${sectionsHtml}
    <div class="step-nav" style="justify-content:center;margin-top:8px">
      <button class="btn btn-primary" id="btn-next" style="width:100%;max-width:360px">${quizSteps.length ? '讀完了，開始測驗 →' : '完成模組'}</button>
    </div>`;
  $('btn-next').addEventListener('click', () => {
    if (quizSteps.length) { currentPhase = 'quiz'; quizIdx = 0; renderStep(); }
    else finishModule();
  });
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function renderQuizStep() {
  const step = quizSteps[quizIdx];
  const isLast = quizIdx === quizSteps.length - 1;
  $('progress-label').textContent = '測驗 ' + (quizIdx + 1) + ' / ' + quizSteps.length;
  $('progress-fill').style.width = (10 + Math.round((quizIdx / quizSteps.length) * 90)) + '%';

  const prevAnswer = answers[quizIdx];
  const card = $('step-card');
  card.innerHTML = `
    <div class="step-kicker">🧠 小測驗（讀完了，靠記憶作答）</div>
    <div class="step-title">${step.q}</div>
    <div class="quiz-options" id="quiz-options"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <div class="step-nav">
      <button class="btn btn-ghost" id="btn-prev">上一步</button>
      <button class="btn btn-primary" id="btn-next" disabled>${isLast ? '完成模組' : '下一步'}</button>
    </div>`;
  const optWrap = $('quiz-options');
  step.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'quiz-opt';
    b.textContent = opt;
    b.addEventListener('click', () => selectAnswer(i));
    optWrap.appendChild(b);
  });
  $('btn-next').addEventListener('click', () => {
    if (isLast) finishModule();
    else { quizIdx++; renderStep(); }
  });
  $('btn-prev').addEventListener('click', () => {
    if (quizIdx > 0) { quizIdx--; renderStep(); }
    else { currentPhase = 'read'; renderStep(); }
  });
  if (prevAnswer) showQuizFeedback(prevAnswer.picked, true);
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function selectAnswer(pickedIdx) {
  const step = quizSteps[quizIdx];
  if (answers[quizIdx]) return; // already answered
  const isCorrect = pickedIdx === step.correct;
  answers[quizIdx] = { picked: pickedIdx, correct: isCorrect };
  showQuizFeedback(pickedIdx, false);
}

function showQuizFeedback(pickedIdx) {
  const step = quizSteps[quizIdx];
  const opts = document.querySelectorAll('#quiz-options .quiz-opt');
  opts.forEach((b, i) => {
    b.disabled = true;
    if (i === step.correct) b.classList.add('correct');
    else if (i === pickedIdx) b.classList.add('wrong');
  });
  const isCorrect = pickedIdx === step.correct;
  const fb = $('quiz-feedback');
  fb.className = 'quiz-feedback show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = `<div class="fb-head">${isCorrect ? '✅ 答對了！' : '❌ 答錯了'}</div><div>${step.exp}</div>`;
  $('btn-next').disabled = false;
}

function finishModule() {
  const total = quizSteps.length;
  const score = quizSteps.filter((s, i) => answers[i] && answers[i].correct).length;
  const percent = total ? Math.round((score/total)*100) : 100;

  $('lesson-wrap').classList.remove('show');
  $('result-wrap').classList.add('show');
  $('result-emoji').textContent = percent >= 80 ? '🎉' : (percent >= 50 ? '💪' : '📖');
  $('result-title').textContent = currentModule.title + ' · 完成！';
  $('result-score').innerHTML = score + ' / ' + total + '<small> 題答對</small>';
  $('result-sub').textContent = percent >= 80
    ? '表現很棒，這個模組你已經掌握得不錯了！'
    : (percent >= 50 ? '基本掌握了，建議重新測驗一次加深印象。' : '建議重新讀過一次，把答錯的觀念再確認清楚。');

  const email = getEmail();
  if (email && GAS_URL) {
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'recordProgress', email,
        moduleId: currentModule.id, moduleTitle: currentModule.title,
        score, total
      })
    }).then(() => { progressCache[currentModule.id] = { moduleTitle: currentModule.title, score, total, percent }; })
      .catch(e => console.warn('進度記錄失敗', e));
  }
}

$('lesson-exit').addEventListener('click', backToList);
$('btn-back-list').addEventListener('click', backToList);
$('btn-retry').addEventListener('click', () => startModule(currentModule.id));

loadProgress();
</script>
</body>
</html>
